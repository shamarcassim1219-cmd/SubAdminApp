name: Build Sub-Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing platform folders
        run: flutter create --platforms=android --project-name mygame_subadmin_app --org com.mygame.subadmin .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Fix applicationId
        run: |
          sed -i 's/applicationId = "com.mygame.subadmin.mygame_subadmin_app"/applicationId = "com.mygame.subadmin"/' android/app/build.gradle
          sed -i 's/applicationId "com.mygame.subadmin.mygame_subadmin_app"/applicationId "com.mygame.subadmin"/' android/app/build.gradle

      - name: Set app display name
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Sub Admin"/' "$MANIFEST"

      - name: Bump minSdkVersion to 23
        run: sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle

      - name: Bump Kotlin plugin version
        run: sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]*(")/\11.9.24\2/' android/settings.gradle

      - name: Ensure permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST"
          grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>' "$MANIFEST"
          grep -q "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' "$MANIFEST"
          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' "$MANIFEST"

      - name: Add browser queries for url_launcher
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "<queries>" "$MANIFEST" || sed -i '/<\/manifest>/i\    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <category android:name="android.intent.category.BROWSABLE" \/>\n            <data android:scheme="https" \/>\n        <\/intent>\n    <\/queries>' "$MANIFEST"

      - name: Add FCM default notification icon
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "com.google.firebase.messaging.default_notification_icon" "$MANIFEST" || sed -i '/<\/application>/i\        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" \/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@android:color/white" \/>' "$MANIFEST"

      - name: Restore consistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygame-subadmin-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
